<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fastify Motion Bro Studio</title><link rel="stylesheet" href="/web/styles.css"></head><body><main><header><div><strong>FASTIFY MOTION BRO</strong><small>Creative Coding Animation Studio</small></div><span id="status">جاري التجهيز...</span></header><section class="studio"><div class="screen"><canvas id="stage" width="540" height="960" aria-label="Motion Graphics preview"></canvas></div><aside><h1>استوديو الحركة</h1><p>مشاهد حقيقية تتحرك بالإطارات، وليست صورًا ثابتة.</p><div id="scene-list"></div><div class="controls"><button id="play">إيقاف مؤقت</button><input id="seek" type="range" min="0" max="1000" value="0"/><output id="time">00:00</output></div><p class="hint">لإعداد فيديو جديد: <code>npm run intake</code> ثم <code>npm run plan</code>. المعاينة لا تعني الموافقة على تصدير نهائي.</p></aside></section></main><script type="module" src="/web/player.js"></script></body></html>
