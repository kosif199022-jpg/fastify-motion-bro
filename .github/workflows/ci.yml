name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  editorial-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-render.txt
          python -m playwright install --with-deps chromium
          ffmpeg -version
      - name: Execute all five explicit workflow stages (test fixture only)
        run: |
          npm run viral -- start
          npm run viral -- reply 2
          npm run viral -- reply NEXT
          npm run viral -- reply 1
          npm run viral -- reply NEXT
          npm run viral -- compile
          npm run viral -- preview-project
      - name: Ensure final render is still denied
        run: |
          python - <<'PY'
          import json
          b=json.load(open('project/storyboard.json',encoding='utf-8'))
          assert b['profile']=='viral-editorial-3d'
          assert b['duration_seconds']==30 and len(b['scenes'])==5
          assert b['aspect']=='9:16' and b['exact_background_lines']==2
          assert b['approval']['final_render'] is False
          print('Editorial gates OK')
          PY
      - name: Render native animated smoke frame sequence
        run: |
          python scripts/render.py --smoke --seconds 7 --height 360 --fps 6 --output output/editorial-smoke.mp4
          python scripts/qa.py output/editorial-smoke.mp4
      - name: Prove temporal change in entrance, hold, exit and transition
        run: |
          python - <<'PY'
          import subprocess,hashlib
          path='output/editorial-smoke.mp4'
          samples=[]
          for t in (0.8, 3.8, 5.4, 6.5):
            p=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-ss',str(t),'-i',path,'-frames:v','1','-f','image2pipe','-vcodec','png','pipe:1'],capture_output=True,check=True)
            assert p.stdout, 'Missing sample frame at '+str(t)
            samples.append(hashlib.sha256(p.stdout).hexdigest())
          assert len(set(samples))==4, 'No meaningful temporal frame differences'
          print('4 different frame samples verified across 6 second scene and next scene start')
          PY
      - name: Upload rendered smoke and QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-motion-smoke
          path: |
            output/editorial-smoke.mp4
            output/qa_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify imported Arabic SRT affects actual Chromium canvas and MP4
        run: |
          cat > /tmp/fmb-caption-fixture.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:03,000
          هذا اختبار حقيقي للكابشن العربي
          مع حركة وتوقيت دقيق داخل الفيديو

          2
          00:00:03,100 --> 00:00:05,500
          العبارات الطويلة تظهر على صفحات متتابعة
          ولا تُحذف أي كلمات أصلية من المحتوى
          SRT
          npm run captions -- check /tmp/fmb-caption-fixture.srt
          npm run captions -- attach /tmp/fmb-caption-fixture.srt project/storyboard.json
          python scripts/qa_caption_overlay.py
          python scripts/render.py --smoke --seconds 3 --height 360 --fps 6 --output output/caption-smoke.mp4
          python scripts/qa.py output/caption-smoke.mp4
      - name: Upload caption video and technical QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-captions-smoke
          path: |
            output/caption-smoke.mp4
            output/qa_report.json
          if-no-files-found: warn
          retention-days: 7
